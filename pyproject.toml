[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["domradar"]

[project]
name = "domradar"
version = "0.1.0"
description = "Dependency-free Python CLI to check domain availability and pull WHOIS/RDAP records"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[[project.authors]]
name = "Nilambar Sharma"
email = "nilambar@outlook.com"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
domradar = "domradar:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
